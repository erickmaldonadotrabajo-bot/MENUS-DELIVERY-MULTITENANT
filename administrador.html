    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((registration) => {
                    registration.update();
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log("🔥 Nueva versión de Admin detectada. Recargando...");
                                window.location.reload(true);
                            }
                        };
                    };
                }).catch(err => console.log('Error SW Admin:', err));
            });
        }
    </script>

            background-color: #111827;

        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-card { animation: fade-in-up 0.3s ease-out forwards; }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }

        #ticket-area {
            position: fixed; top: 0; left: -9999px; width: 58mm;
            background-color: white; color: black; z-index: -1;
        }

        @media print {
            @page { size: 58mm auto; margin: 0mm; }
            body { margin: 0; padding: 0; background-color: white; }
            body * { visibility: hidden; height: 0; overflow: hidden; }
            
            #ticket-area {
                visibility: visible; position: absolute; left: 0 !important; top: 0 !important;

            .ticket-header { text-align: center; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; }
            .ticket-logo { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 5px; background-color: white; filter: grayscale(100%) contrast(100%) brightness(110%); object-fit: cover; }
            .ticket-divider { border-bottom: 2px dashed #000; margin: 5px 0; width: 100%; }

        }

                            <button onClick={handleCancelClick} className="col-span-1 bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white border border-red-600/50 rounded-xl flex flex-col items-center justify-center p-2 transition-all w-full">

                                <a href={mapLink} target="_blank" className="col-span-1 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-600/50 rounded-xl flex flex-col items-center justify-center p-2 transition-all w-full">

        const Modal = ({isOpen, onClose, type, editItem, categories, onSave}) => {
            const [form, setForm] = useState({});
            const [newTopping, setNewTopping] = useState("");
            const [toppingsList, setToppingsList] = useState([]);
            const [extrasList, setExtrasList] = useState([]);
            
            const [uploadingField, setUploadingField] = useState(null); 
            const [uploadProgress, setUploadProgress] = useState(0); 
            
            useEffect(() => {
                if (isOpen) {
                    if (editItem) { 
                        setForm(editItem); 
                        setToppingsList(editItem.removables || []); 
                        setExtrasList(editItem.extras || []);
                    } else { 
                        setForm(type === 'product' ? { categoria_id: categories[0]?.id } : {}); 
                        setToppingsList([]); 
                        setExtrasList([]);
                    }
                    setNewTopping("");
                    setUploadingField(null);
                    setUploadProgress(0);
                }
            }, [isOpen, type, categories, editItem]);
            
            if (!isOpen) return null;
            
            const handleAddTopping = () => { 
                if (newTopping.trim() !== "") { 
                    setToppingsList([...toppingsList, newTopping.trim()]); 
                    setNewTopping(""); 
                } 
            };
            const removeTopping = (idx) => { setToppingsList(toppingsList.filter((_, i) => i !== idx)); };

            const handleAddExtra = () => {
                if (extrasList.length < 15) {
                    setExtrasList([...extrasList, { nombre: '', precio: '' }]);
                }
            };

            const updateExtra = (index, field, value) => {
                const newExtras = [...extrasList];
                newExtras[index][field] = field === 'precio' ? (value ? parseFloat(value) : '') : value;
                setExtrasList(newExtras);
            };

            const removeExtra = (index) => { setExtrasList(extrasList.filter((_, i) => i !== index)); };

            const deleteOldFileFromBucket = async (url) => {
                if (!url) return;
                try {
                    const urlParts = url.split('/');
                    const fileName = urlParts[urlParts.length - 1];
                    if (fileName) await supabase.storage.from('productos').remove([fileName]);
                } catch (e) {
                    console.error("Fallo al intentar borrar archivo antiguo", e);
                }
            };

            const handleRemoveMedia = async (field) => {
                const currentUrl = form[field];
                if (currentUrl) {
                    if (confirm(`¿Estás seguro de eliminar este ${field === 'video_url' ? 'video' : 'imagen'}?`)) {
                        await deleteOldFileFromBucket(currentUrl);
                        setForm(prev => ({ ...prev, [field]: null }));
                    }
                }
            };

            const processVideoWithoutAudio = (file) => {
                return new Promise((resolve, reject) => {
                    const videoNode = document.createElement('video');
                    videoNode.src = URL.createObjectURL(file);
                    videoNode.muted = true;
                    videoNode.play().catch(e => reject("El navegador bloqueó la reproducción oculta"));

                    videoNode.onloadedmetadata = () => {
                        if (videoNode.duration > 10) { reject("El video no puede durar más de 10 segundos."); return; }

                        const canvas = document.createElement('canvas');
                        canvas.width = videoNode.videoWidth;
                        canvas.height = videoNode.videoHeight;
                        const ctx = canvas.getContext('2d');

                        const stream = canvas.captureStream(30);
                        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                        const chunks = [];

                        recorder.ondataavailable = e => chunks.push(e.data);
                        recorder.onstop = () => {
                            const silentBlob = new Blob(chunks, { type: 'video/webm' });
                            const newFile = new File([silentBlob], 'video_optimizado.webm', { type: 'video/webm' });
                            resolve(newFile);
                        };

                        recorder.start();

                        const drawFrame = () => {
                            if (!videoNode.paused && !videoNode.ended) {
                                ctx.drawImage(videoNode, 0, 0, canvas.width, canvas.height);
                                requestAnimationFrame(drawFrame);
                            }
                        };
                        drawFrame();

                        videoNode.onended = () => { recorder.stop(); };
                    };
                    videoNode.onerror = () => reject("Error al leer el archivo de video.");
                });
            };

            const handleMediaUpload = async (e, field) => {
                let file = e.target.files[0];
                if (!file) return;

                if (file.size > 49 * 1024 * 1024) { 
                    alert("Tu archivo es muy pesado (máximo 49 MB). Por favor, usa una aplicación externa para comprimirlo o bajarle la resolución.");
                    e.target.value = null; return;
                }

                setUploadingField(field); setUploadProgress(10); 

                try {
                    if (form[field]) { await deleteOldFileFromBucket(form[field]); }

                    if (field === 'video_url') {
                        setUploadProgress(30);
                        try {
                            file = await processVideoWithoutAudio(file);
                            setUploadProgress(50);
                        } catch (err) {
                            setUploadingField(null); setUploadProgress(0);
                            alert(`Error procesando el video: ${err}`);
                            return;
                        }
                    } else { setUploadProgress(50); }

                    const fileExt = file.name.split('.').pop() || (field === 'video_url' ? 'webm' : 'jpg');
                    const fileName = `${field === 'video_url' ? 'vid' : 'img'}_${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    setUploadProgress(70);

                    const { error: uploadError } = await supabase.storage.from('productos').upload(fileName, file);
                    if (uploadError) throw uploadError;

                    setUploadProgress(100);

                    const { data: { publicUrl } } = supabase.storage.from('productos').getPublicUrl(fileName);

                    setTimeout(() => {
                        setForm(prev => ({ ...prev, [field]: publicUrl }));
                        setUploadingField(null); setUploadProgress(0);
                    }, 500);

                } catch (err) {
                    alert('Error al subir. Asegúrate de haber creado el bucket "productos" en Supabase.');
                    setUploadingField(null); setUploadProgress(0);
                }
            };
            
            const handleSubmit = (e) => { 
                e.preventDefault(); 
                const cleanExtras = extrasList.filter(ext => ext.nombre.trim() !== '');

                let finalData;
                if (type === 'category') {
                    finalData = { nombre: form.nombre, nota_preparacion: form.nota_preparacion };
                } else {
                    finalData = { ...form, extras: cleanExtras, has_extra: cleanExtras.length > 0, removables: toppingsList };
                }
                
                onSave(finalData, editItem?.id); 
                onClose(); 
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 w-full h-full overflow-hidden">
                    <div className="bg-gray-800 w-full max-w-md rounded-2xl p-6 border border-gray-700 shadow-2xl overflow-y-auto max-h-[90vh]">
                        <h2 className="text-2xl font-bold text-white mb-4">{editItem ? 'Editar' : 'Nuevo'} {type === 'category' ? 'Categoría' : 'Producto'}</h2>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-400 text-sm mb-1">Nombre</label>
                                <input required value={form.nombre || ''} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none" onChange={e => setForm({...form, nombre: e.target.value})} disabled={uploadingField !== null} />
                            </div>
                            
                            {type === 'category' && (
                                <div>
                                    <label className="block text-gray-400 text-sm mb-1">Descripción / Nota</label>
                                    <input value={form.nota_preparacion || ''} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none" placeholder="Ej: Especialidad de la casa..." onChange={e => setForm({...form, nota_preparacion: e.target.value})} disabled={uploadingField !== null} />
                                </div>
                            )}
                            
                            {type === 'product' && (
                                <React.Fragment>
                                    <div>
                                        <label className="block text-gray-400 text-sm mb-1">Descripción del producto</label>
                                        <textarea value={form.descripcion || ''} onChange={e => setForm({...form, descripcion: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-orange-500" rows="2" placeholder="Ej: Deliciosa combinación de..." disabled={uploadingField !== null}></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-gray-400 text-sm mb-1">Precio Base</label><input required type="number" value={form.precio || ''} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none" onChange={e => setForm({...form, precio: e.target.value})} disabled={uploadingField !== null} /></div>
                                    </div>
                                    
                                    <div className="p-3 bg-gray-900 rounded-xl border border-gray-700">
                                        <label className="block text-orange-400 text-sm font-bold mb-2">Ingredientes Removibles</label>
                                        <div className="flex gap-2 mb-2">
                                            <input className="flex-1 min-w-0 bg-gray-800 border border-gray-600 rounded-lg p-2 text-white text-sm outline-none" placeholder="Ej: Cebolla" value={newTopping} onChange={(e) => setNewTopping(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && (e.preventDefault(), handleAddTopping())} disabled={uploadingField !== null} />
                                            <button type="button" onClick={handleAddTopping} className="bg-gray-700 px-3 rounded-lg text-white hover:bg-gray-600" disabled={uploadingField !== null}><Icons.Plus /></button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {toppingsList.map((t, i) => (
                                                <span key={i} className="bg-orange-600/20 text-orange-200 text-xs px-2 py-1 rounded-full flex items-center gap-1 border border-orange-600/40">{t}<button type="button" onClick={() => removeTopping(i)} className="hover:text-white" disabled={uploadingField !== null}><Icons.X /></button></span>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-gray-400 text-sm mb-1">URL del Video (Opcional - máx 10 seg o 49 MB)</label>
                                        <div className="flex flex-col gap-2">
                                            <div className="flex gap-2">
                                                <input type="text" value={form.video_url || ''} className="flex-1 bg-gray-900 border border-gray-600 rounded-lg p-3 text-gray-500 outline-none focus:border-orange-500 min-w-0" placeholder="https://..." readOnly />
                                                
                                                {form.video_url && (
                                                    <button type="button" onClick={() => handleRemoveMedia('video_url')} className="bg-red-900/50 border border-red-700 rounded-lg px-3 text-red-400 hover:bg-red-800 transition shrink-0" title="Eliminar Video">
                                                        <Icons.Trash />
                                                    </button>
                                                )}

                                                <label className={`bg-gray-800 border border-gray-600 rounded-lg px-4 flex items-center justify-center cursor-pointer hover:bg-gray-700 transition shrink-0 ${uploadingField !== null && uploadingField !== 'video_url' ? 'opacity-50 pointer-events-none' : ''}`} title={form.video_url ? "Reemplazar Video" : "Subir Video"}>
                                                    {uploadingField === 'video_url' ? <span className="text-xs text-orange-400 font-bold">{Math.round(uploadProgress)}%</span> : <Icons.Upload />}
                                                    <input type="file" accept="video/*" className="hidden" onChange={(e) => handleMediaUpload(e, 'video_url')} disabled={uploadingField !== null} />
                                                </label>
                                            </div>
                                            {uploadingField === 'video_url' && uploadProgress > 0 && (
                                                <div className="w-full bg-gray-700 rounded-full h-1.5 mt-1 overflow-hidden">
                                                    <div className="bg-orange-500 h-1.5 rounded-full transition-all duration-300" style={{width: `${uploadProgress}%`}}></div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-gray-400 text-sm mb-1">URL de Imagen (Opcional)</label>
                                        <div className="flex flex-col gap-2">
                                            <div className="flex gap-2">
                                                <input type="text" value={form.image_url || ''} className="flex-1 bg-gray-900 border border-gray-600 rounded-lg p-3 text-gray-500 outline-none focus:border-orange-500 min-w-0" placeholder="https://..." readOnly />
                                                
                                                {form.image_url && (
                                                    <button type="button" onClick={() => handleRemoveMedia('image_url')} className="bg-red-900/50 border border-red-700 rounded-lg px-3 text-red-400 hover:bg-red-800 transition shrink-0" title="Eliminar Imagen">
                                                        <Icons.Trash />
                                                    </button>
                                                )}

                                                <label className={`bg-gray-800 border border-gray-600 rounded-lg px-4 flex items-center justify-center cursor-pointer hover:bg-gray-700 transition shrink-0 ${uploadingField !== null && uploadingField !== 'image_url' ? 'opacity-50 pointer-events-none' : ''}`} title={form.image_url ? "Reemplazar Imagen" : "Subir Imagen"}>
                                                    {uploadingField === 'image_url' ? <span className="text-xs text-orange-400 font-bold">{Math.round(uploadProgress)}%</span> : <Icons.Upload />}
                                                    <input type="file" accept="image/*" className="hidden" onChange={(e) => handleMediaUpload(e, 'image_url')} disabled={uploadingField !== null} />
                                                </label>
                                            </div>
                                            {uploadingField === 'image_url' && uploadProgress > 0 && (
                                                <div className="w-full bg-gray-700 rounded-full h-1.5 mt-1 overflow-hidden">
                                                    <div className="bg-orange-500 h-1.5 rounded-full transition-all duration-300" style={{width: `${uploadProgress}%`}}></div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-gray-900 p-3 rounded-xl border border-gray-700">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="text-orange-400 text-sm font-bold">Extras del Producto (Máx 15)</label>
                                            {extrasList.length < 15 && (
                                                <button type="button" onClick={handleAddExtra} className="text-[10px] bg-orange-600 hover:bg-orange-500 px-2 py-1 rounded text-white font-bold transition-all shadow" disabled={uploadingField !== null}>+ AGREGAR</button>
                                            )}
                                        </div>
                                        
                                        {extrasList.length === 0 && <p className="text-xs text-gray-500 italic mb-2">Sin extras configurados.</p>}

                                        <div className="space-y-2">
                                            {extrasList.map((ext, i) => (
                                                <div key={i} className="flex gap-2 items-center">
                                                    <input type="text" placeholder="Ej: Queso Extra" value={ext.nombre} onChange={e => updateExtra(i, 'nombre', e.target.value)} className="flex-1 bg-gray-800 border border-gray-600 p-2 rounded-lg text-white text-sm outline-none focus:border-orange-500 min-w-0" disabled={uploadingField !== null} />
                                                    <div className="relative w-20 sm:w-24 shrink-0">
                                                        <span className="absolute left-2 top-2 text-gray-500 text-sm">$</span>
                                                        <input type="number" placeholder="0" value={ext.precio} onChange={e => updateExtra(i, 'precio', e.target.value)} className="w-full bg-gray-800 border border-gray-600 py-2 pr-2 pl-6 rounded-lg text-white text-sm outline-none focus:border-orange-500" disabled={uploadingField !== null} />
                                                    </div>
                                                    <button type="button" onClick={() => removeExtra(i)} className="text-red-500 hover:text-red-400 p-1 shrink-0" disabled={uploadingField !== null}><Icons.Trash /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-gray-400 text-sm mb-1">Categoría</label>
                                        <select value={form.categoria_id || ''} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none" onChange={e => setForm({...form, categoria_id: e.target.value})} disabled={uploadingField !== null}>
                                            {categories.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                                        </select>
                                    </div>
                                </React.Fragment>
                            )}
                            
                            <button type="submit" className="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl mt-4 shadow-lg disabled:opacity-50" disabled={uploadingField !== null}>GUARDAR {type === 'category' ? 'CATEGORÍA' : 'PRODUCTO'}</button>
                            <button type="button" onClick={onClose} className="w-full text-gray-400 py-2 hover:text-white transition-colors" disabled={uploadingField !== null}>Cancelar</button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem(`admin_auth_${TIENDA_ID}`) === 'true');
            const [pinInput, setPinInput] = useState('');
            const [loginError, setLoginError] = useState(false);

            const [view, setView] = useState('orders');
            const [tienda, setTienda] = useState(null);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [historyOrders, setHistoryOrders] = useState([]); 
            const [activeCat, setActiveCat] = useState('Todas');
            const [search, setSearch] = useState('');
            const [modal, setModal] = useState({open: false, type: null, editItem: null});
            const [loading, setLoading] = useState(true);
            const [ticketOrder, setTicketOrder] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            const [hasNewOrder, setHasNewOrder] = useState(false);

            const [stats, setStats] = useState({
                ventasSemana: 0, ventasMes: 0, canceladosSemana: 0, canceladosMes: 0, masVendido: '-', menosVendido: '-'
            });

            const [historyFilterDays, setHistoryFilterDays] = useState(1);
            const [historyFilterStatus, setHistoryFilterStatus] = useState('todos');

            const [configForm, setConfigForm] = useState(null);
            const [uploadingLogo, setUploadingLogo] = useState(false);
            const [logoUploadProgress, setLogoUploadProgress] = useState(0); 

            const [autoPrint, setAutoPrint] = useState(() => localStorage.getItem('saas_autoprint') === 'true');
            const autoPrintRef = useRef(autoPrint);
            
            useEffect(() => {
                localStorage.setItem('saas_autoprint', autoPrint);
                autoPrintRef.current = autoPrint;
            }, [autoPrint]);

            const showToast = useCallback((msg) => { 
                setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); 
            }, []);

            const loadStats = async () => {
                try {
                    const date30DaysAgo = new Date(); date30DaysAgo.setDate(date30DaysAgo.getDate() - 30);
                    const date7DaysAgo = new Date(); date7DaysAgo.setDate(date7DaysAgo.getDate() - 7);

                    const { data, error } = await supabase
                        .from('pedidos')
                        .select('id, cliente_nombre, estado, total_final, detalle_json, created_at') 
                        .eq('tienda_id', TIENDA_ID)
                        .gte('created_at', date30DaysAgo.toISOString())
                        .order('created_at', { ascending: false });

                    if (error || !data) return;

                    let vSemana = 0; let vMes = 0; let cSemana = 0; let cMes = 0; let productsCount = {};

                    data.forEach(p => {
                        const isSemana = new Date(p.created_at) >= date7DaysAgo;
                        if (p.estado === 'despachado') {
                            vMes += parseFloat(p.total_final) || 0;
                            if (isSemana) vSemana += parseFloat(p.total_final) || 0;
                            const items = Array.isArray(p.detalle_json) ? p.detalle_json : (typeof p.detalle_json === 'string' ? JSON.parse(p.detalle_json) : []);
                            items.forEach(item => { productsCount[item.nombre] = (productsCount[item.nombre] || 0) + (item.qty || 1); });
                        } else if (p.estado === 'cancelado') {
                            cMes += 1; if (isSemana) cSemana += 1;
                        }
                    });

                    let maxSold = '-'; let minSold = '-'; let maxCount = -1; let minCount = Infinity;
                    Object.entries(productsCount).forEach(([name, count]) => {
                        if (count > maxCount) { maxCount = count; maxSold = name; }
                        if (count < minCount) { minCount = count; minSold = name; }
                    });

                    setStats({
                        ventasSemana: vSemana, ventasMes: vMes, canceladosSemana: cSemana, canceladosMes: cMes,
                        masVendido: maxCount > -1 ? `${maxSold} (${maxCount})` : 'Sin datos',
                        menosVendido: minCount < Infinity ? `${minSold} (${minCount})` : 'Sin datos'
                    });
                    setHistoryOrders(data);
                } catch (e) { console.error("Error al cargar stats:", e); }
            };

            const fetchData = useCallback(async () => {
                if (!supabase) return;
                
                const { data: t } = await supabase.from('tiendas').select('*').eq('id', TIENDA_ID).single();
                setTienda(t);
                setConfigForm(t);
                
                const { data: cats } = await supabase.from('categorias').select('*').eq('tienda_id', TIENDA_ID).order('orden');
                const { data: prods } = await supabase.from('menu_items').select('*').eq('tienda_id', TIENDA_ID).order('orden');
                
                setCategories(cats || []); 
                setProducts(prods || []);
                
                const { data: ords } = await supabase.from('pedidos').select('*').eq('tienda_id', TIENDA_ID).eq('estado', 'pendiente').order('created_at', {ascending: false});
                setOrders(ords || []);
                
                loadStats();
                setLoading(false);
            }, []);

            useEffect(() => {
                if (isAuthenticated) {
                    fetchData();
                    const ordersChannel = supabase.channel('admin_orders_' + TIENDA_ID)
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos', filter: `tienda_id=eq.${TIENDA_ID}` }, (payload) => {
                            if (payload.eventType === 'INSERT') {
                                setOrders(prev => [payload.new, ...prev]);
                                setHasNewOrder(true);
                                alertSound.play().catch(e=>console.log("Audio play blocked"));
                                if (autoPrintRef.current) {
                                    setTicketOrder(payload.new);
                                    setTimeout(() => window.print(), 800);
                                }
                                loadStats(); 
                            } else if (payload.eventType === 'UPDATE' && payload.new.estado !== 'pendiente') {
                                setOrders(prev => prev.filter(o => o.id !== payload.new.id));
                                loadStats(); 
                            }
                        }).subscribe();
                        
                    return () => { supabase.removeChannel(ordersChannel); };
                }
            }, [isAuthenticated, fetchData]);

            const acknowledgeNewOrder = () => { setHasNewOrder(false); alertSound.pause(); alertSound.currentTime = 0; };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError(false);
                const { data, error } = await supabase.from('tiendas').select('admin_pin').eq('id', TIENDA_ID).single();
                
                if (error || !data) { setLoginError(true); return; }

                const correctPin = data.admin_pin || '1234';
                if (pinInput === correctPin) {
                    setIsAuthenticated(true);
                    localStorage.setItem(`admin_auth_${TIENDA_ID}`, 'true');
                } else { setLoginError(true); }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                localStorage.removeItem(`admin_auth_${TIENDA_ID}`);
                setPinInput('');
            };

            const handleLogoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setUploadingLogo(true);
                setLogoUploadProgress(0);

                const progressInterval = setInterval(() => {
                    setLogoUploadProgress(prev => {
                        const newProg = prev + Math.random() * 15;
                        return newProg > 90 ? 90 : newProg;
                    });
                }, 400);

                try {
                    if (configForm.logo_url) {
                        const urlParts = configForm.logo_url.split('/');
                        const oldFileName = urlParts[urlParts.length - 1];
                        if (oldFileName) await supabase.storage.from('logos').remove([oldFileName]);
                    }

                    const fileExt = file.name.split('.').pop();
                    const fileName = `logo_${TIENDA_ID}_${Date.now()}.${fileExt}`;
                    
                    const { error: uploadError } = await supabase.storage.from('logos').upload(fileName, file);
                    if (uploadError) throw uploadError;

                    clearInterval(progressInterval);
                    setLogoUploadProgress(100);

                    const { data: { publicUrl } } = supabase.storage.from('logos').getPublicUrl(fileName);

                    setTimeout(() => {
                        setConfigForm(prev => ({ ...prev, logo_url: publicUrl }));
                        showToast('Logo subido exitosamente. No olvides guardar cambios.');
                        setUploadingLogo(false);
                        setLogoUploadProgress(0);
                    }, 500);
                } catch (err) {
                    clearInterval(progressInterval);
                    showToast('Error al subir. Revisa las politicas del Bucket.');
                    setUploadingLogo(false); setLogoUploadProgress(0);
                }
            };

            const saveStoreSettings = async (e) => {
                e.preventDefault();
                const updateData = {
                    nombre: configForm.nombre, telefono_whatsapp: configForm.telefono_whatsapp, logo_url: configForm.logo_url,
                    mensaje_bienvenida: configForm.mensaje_bienvenida, mensaje_cerrado: configForm.mensaje_cerrado,
                    horarios_texto: configForm.horarios_texto, color_primario: configForm.color_primario,
                    color_secundario: configForm.color_secundario, color_fondo: configForm.color_fondo,
                    color_delivery: configForm.color_delivery, color_pickup: configForm.color_pickup,
                    latitud: parseFloat(configForm.latitud), longitud: parseFloat(configForm.longitud),
                    porcentaje_tarjeta: parseFloat(configForm.porcentaje_tarjeta), datos_bancarios: configForm.datos_bancarios,
                    max_delivery_radius: parseFloat(configForm.max_delivery_radius),
                    delivery_tiers: Array.isArray(configForm.delivery_tiers) ? configForm.delivery_tiers : []
                };

                if (configForm.admin_pin && configForm.admin_pin.trim() !== '') { updateData.admin_pin = configForm.admin_pin.trim(); }

                try {
                    const { error } = await supabase.from('tiendas').update(updateData).eq('id', TIENDA_ID);
                    if (error) throw error;
                    setTienda({...tienda, ...updateData});
                    showToast('¡Ajustes guardados correctamente!');
                } catch (err) { showToast('Error al guardar ajustes.'); }
            };

            const handleTierChange = (index, field, value) => {
                const safeTiers = Array.isArray(configForm.delivery_tiers) ? configForm.delivery_tiers : [];
                const newTiers = [...safeTiers];
                newTiers[index] = { ...newTiers[index] };
                newTiers[index][field] = field === 'name' ? value : parseFloat(value) || 0;
                setConfigForm({...configForm, delivery_tiers: newTiers});
            };

            const handleCompleteOrder = async (id) => { 
                setOrders(prev => prev.filter(o => o.id !== id)); 
                await supabase.from('pedidos').update({ estado: 'despachado' }).eq('id', id); 
            };

            const handleCancelOrder = async (id) => { 
                setOrders(prev => prev.filter(o => o.id !== id)); 
                await supabase.from('pedidos').update({ estado: 'cancelado' }).eq('id', id); 
                showToast("Pedido Cancelado Exitosamente");
            };

            const toggleStore = async () => {

                setTienda({...tienda, abierto: newState});

            const guardarPrecio = async (id, nuevoPrecio) => {

                if (item.image_url) {

                    await supabase.storage.from('productos').remove([urlParts[urlParts.length - 1]]);
                }
                if (item.video_url) {
                    const urlParts = item.video_url.split('/');
                    await supabase.storage.from('productos').remove([urlParts[urlParts.length - 1]]);

                setProducts(prev => prev.filter(p => p.id !== item.id));

                    const diffTime = Math.abs(now - orderDate);

                                                                {item.removables.map((t, idx) => <span key={idx} className="text-[9px] bg-gray-700 text-gray-300 px-1.5 rounded border border-gray-600">Sin {t}</span>)}
                                                            </div>
                                                        )}

                                                        {item.extras && item.extras.length > 0 && (
                                                            <p className="text-[10px] text-gray-500 mt-2 italic">Contiene {item.extras.length} extra(s) config.</p>
                                                        )}
                                                    </div>
                                                    <button onClick={()=>toggleProduct(item.id, item.disponible)} className={`w-full py-2 rounded-lg text-xs font-bold transition-colors ${item.disponible ? 'bg-green-600/20 text-green-400 border border-green-600/50' : 'bg-red-600/20 text-red-400 border border-red-600/50'}`}>{item.disponible ? 'DISPONIBLE' : 'AGOTADO'}</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'settings' && configForm && (
                        <div className="p-4 animate-card max-w-2xl mx-auto space-y-6 w-full">
                            <form onSubmit={saveStoreSettings}>
                                
                                <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg mb-6 w-full overflow-hidden">
                                    <h3 className="text-orange-400 font-bold mb-4 uppercase tracking-widest text-sm border-b border-gray-700 pb-2">Seguridad del Panel</h3>
                                    <div>
                                        <label className="block text-gray-400 text-xs mb-1">Nueva Contraseña (PIN)</label>
                                        <input type="text" placeholder="Dejar en blanco para mantener la actual" value={configForm.admin_pin || ''} onChange={e=>setConfigForm({...configForm, admin_pin: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-orange-500 font-mono" />
                                        <p className="text-[11px] text-gray-500 mt-1">Usa este PIN la próxima vez que quieras ingresar a administrar este negocio.</p>
                                    </div>
                                </div>

                                <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg mb-6 w-full overflow-hidden">
                                    <h3 className="text-orange-400 font-bold mb-4 uppercase tracking-widest text-sm border-b border-gray-700 pb-2">Logotipo del Restaurante</h3>
                                    <div className="flex flex-col sm:flex-row items-center gap-6">
                                        <div className="w-24 h-24 rounded-full border-2 border-orange-500 overflow-hidden bg-gray-900 flex items-center justify-center shadow-inner flex-shrink-0">
                                            {configForm.logo_url ? (
                                                <img src={configForm.logo_url} alt="Logo" className="w-full h-full object-cover" />
                                            ) : (
                                                <span className="text-xs text-gray-500">Sin Logo</span>
                                            )}
                                        </div>
                                        <div className="flex-1 w-full space-y-2">
                                            <label className="block text-gray-400 text-xs">Sube tu imagen (PNG o JPG recomendado)</label>
                                            <div className="flex flex-col gap-2 w-full">
                                                <label className="flex-1 bg-gray-900 border border-gray-600 rounded-lg p-3 text-white text-sm cursor-pointer hover:border-orange-500 transition-colors flex items-center justify-center gap-2 break-words">
                                                    <Icons.Upload />
                                                    <span className="truncate">{uploadingLogo ? `Subiendo... ${Math.round(logoUploadProgress)}%` : 'Seleccionar archivo...'}</span>
                                                    <input type="file" accept="image/*" onChange={handleLogoUpload} disabled={uploadingLogo} className="hidden" />
                                                </label>
                                                {uploadingLogo && logoUploadProgress > 0 && (
                                                    <div className="w-full bg-gray-700 rounded-full h-1.5 overflow-hidden">
                                                        <div className="bg-orange-500 h-1.5 rounded-full transition-all duration-300" style={{width: `${logoUploadProgress}%`}}></div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg mb-6 w-full overflow-hidden">
                                    <h3 className="text-orange-400 font-bold mb-4 uppercase tracking-widest text-sm border-b border-gray-700 pb-2">Datos Generales</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-gray-400 text-xs mb-1">Nombre del Restaurante</label>
                                            <input type="text" required value={configForm.nombre} onChange={e=>setConfigForm({...configForm, nombre: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-orange-500" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 text-xs mb-1">Teléfono (WhatsApp)</label>
                                            <input type="text" required value={configForm.telefono_whatsapp} onChange={e=>setConfigForm({...configForm, telefono_whatsapp: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-orange-500" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 text-xs mb-1">Mensaje de Bienvenida</label>
                                            <input type="text" value={configForm.mensaje_bienvenida || ''} onChange={e=>setConfigForm({...configForm, mensaje_bienvenida: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-orange-500" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 text-xs mb-1">Mensaje Cerrado</label>
                                            <input type="text" value={configForm.mensaje_cerrado || ''} onChange={e=>setConfigForm({...configForm, mensaje_cerrado: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-orange-500" />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gray-800 p-6 rounded-xl border border-orange-500/40 shadow-xl mb-6 text-center">
                                    <h3 className="text-orange-400 font-bold mb-4 uppercase tracking-widest text-sm border-b border-gray-700 pb-2">Código QR del Menú Digital</h3>
                                    <p className="text-gray-400 text-xs mb-4">Descarga este código para imprimirlo y ponerlo en las mesas de tu establecimiento.</p>
                                    <div className="bg-white p-4 rounded-2xl shadow-inner inline-block mb-4">
                                        <img 
                                            src={`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(linkMenuQR)}`} 
                                            alt="QR Code Menú" 
                                            className="w-48 h-48 object-contain mx-auto"
                                        />
                                    </div>
                                    <div>
                                        <button 
                                            type="button"
                                            onClick={() => window.open(`https://api.qrserver.com/v1/create-qr-code/?size=1200x1200&data=${encodeURIComponent(linkMenuQR)}`, '_blank')} 
                                            className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl text-sm font-bold shadow-lg transition-all active:scale-95"
                                        >
                                            📥 DESCARGAR QR EN ALTA CALIDAD
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg mb-6 w-full overflow-hidden">
                                    <h3 className="text-orange-400 font-bold mb-4 uppercase tracking-widest text-sm border-b border-gray-700 pb-2">Apariencia (Colores App Clientes)</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                                        <div><label className="block text-gray-400 text-xs mb-1 text-center">Primario</label><input type="color" value={configForm.color_primario || '#f97316'} onChange={e=>setConfigForm({...configForm, color_primario: e.target.value})} className="w-full h-12 rounded cursor-pointer bg-gray-900 border border-gray-600" /></div>
                                        <div><label className="block text-gray-400 text-xs mb-1 text-center">Secundario</label><input type="color" value={configForm.color_secundario || '#ef4444'} onChange={e=>setConfigForm({...configForm, color_secundario: e.target.value})} className="w-full h-12 rounded cursor-pointer bg-gray-900 border border-gray-600" /></div>
                                        <div><label className="block text-gray-400 text-xs mb-1 text-center">Fondo</label><input type="color" value={configForm.color_fondo || '#111827'} onChange={e=>setConfigForm({...configForm, color_fondo: e.target.value})} className="w-full h-12 rounded cursor-pointer bg-gray-900 border border-gray-600" /></div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-gray-700 pt-4">
                                        <div><label className="block text-orange-400 text-xs mb-1 text-center font-bold">Botón Domicilio</label><input type="color" value={configForm.color_delivery || '#f97316'} onChange={e=>setConfigForm({...configForm, color_delivery: e.target.value})} className="w-full h-12 rounded cursor-pointer bg-gray-900 border border-gray-600" /></div>
                                        <div><label className="block text-purple-400 text-xs mb-1 text-center font-bold">Botón Pickup</label><input type="color" value={configForm.color_pickup || '#a855f7'} onChange={e=>setConfigForm({...configForm, color_pickup: e.target.value})} className="w-full h-12 rounded cursor-pointer bg-gray-900 border border-gray-600" /></div>
                                    </div>
                                </div>

                                <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg mb-6 w-full overflow-hidden">
                                    <h3 className="text-orange-400 font-bold mb-4 uppercase tracking-widest text-sm border-b border-gray-700 pb-2">Ubicación y Envíos</h3>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div><label className="block text-gray-400 text-xs mb-1">Latitud</label><input type="number" step="any" required value={configForm.latitud} onChange={e=>setConfigForm({...configForm, latitud: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none" /></div>
                                            <div><label className="block text-gray-400 text-xs mb-1">Longitud</label><input type="number" step="any" required value={configForm.longitud} onChange={e=>setConfigForm({...configForm, longitud: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none" /></div>
                                        </div>
                                        <div><label className="block text-gray-400 text-xs mb-1">Radio Máximo (km)</label><input type="number" step="0.1" required value={configForm.max_delivery_radius} onChange={e=>setConfigForm({...configForm, max_delivery_radius: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none" /></div>
                                        
                                        <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 w-full overflow-hidden">
                                            <label className="block text-gray-400 text-xs mb-3">Tarifas de Envío por Distancia</label>
                                            {safeTiers.map((tier, index) => (
                                                <div key={index} className="flex flex-wrap sm:flex-nowrap gap-2 mb-2 items-center w-full">
                                                    <input type="number" step="0.1" placeholder="Km" value={tier.maxDistance} onChange={e => handleTierChange(index, 'maxDistance', e.target.value)} className="w-20 sm:w-24 bg-gray-800 border border-gray-600 rounded p-2 text-white text-sm" />
                                                    <input type="number" step="0.1" placeholder="$ Costo" value={tier.cost} onChange={e => handleTierChange(index, 'cost', e.target.value)} className="w-20 sm:w-24 bg-gray-800 border border-gray-600 rounded p-2 text-white text-sm" />
                                                    <input type="text" placeholder="Zona" value={tier.name} onChange={e => handleTierChange(index, 'name', e.target.value)} className="flex-1 w-full sm:w-auto min-w-0 bg-gray-800 border border-gray-600 rounded p-2 text-white text-sm" />
                                                    <button type="button" onClick={() => setConfigForm({...configForm, delivery_tiers: configForm.delivery_tiers.filter((_, i) => i !== index)})} className="text-red-500 p-2 shrink-0"><Icons.X /></button>
                                                </div>
                                            ))}
                                            <button type="button" onClick={() => setConfigForm({...configForm, delivery_tiers: [...safeTiers, {maxDistance: 5, cost: 30, name: "Zona General"}]})} className="mt-2 text-orange-400 text-sm font-bold">+ Agregar Tarifa</button>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-xl active:scale-95">
                                    GUARDAR AJUSTES
                                </button>
                            </form>
                        </div>
                    )}

                    <Modal isOpen={modal.open} type={modal.type} editItem={modal.editItem} categories={categories} onClose={()=>setModal({open:false, type:null, editItem:null})} onSave={saveItem}/>
                    <Ticket order={ticketOrder} tienda={tienda}/>
                </div>
            );
        };

        // ==========================================
        // ARRANQUE Y CANDADO MAESTRO (ACTUALIZADO)
        // ==========================================
        const initApp = async () => {
            const parametroTienda = new URLSearchParams(window.location.search).get('tienda');

            const getCleanDomain = () => {
                let hostname = window.location.hostname;
                hostname = hostname.replace(/^www\./, ''); 
                hostname = hostname.split(':')[0]; 
                return hostname.trim().toLowerCase(); 
            };

            CLEAN_HOSTNAME = getCleanDomain();
            
            const isPremiumDomain = CLEAN_HOSTNAME !== 'localhost' 
                                 && CLEAN_HOSTNAME !== '127.0.0.1' 
                                 && !CLEAN_HOSTNAME.endsWith('netlify.app')
                                 && !CLEAN_HOSTNAME.endsWith('netlify.com');

            IS_PREMIUM_DOMAIN = isPremiumDomain;

            try {
                let data = null;

                if (isPremiumDomain) {
                    // FASE 1 ESTRICTA: Dominio Propio
                    const res = await supabase.from('tiendas').select('id, slug').ilike('dominio_personal', CLEAN_HOSTNAME).maybeSingle();
                    
                    if (res.error) throw new Error(res.error.message);
                    
                    if (!res.data) {
                        document.body.innerHTML = `
                            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">🛑</div>
                                <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Acceso Denegado</h2>
                                <p style="color: #d1d5db;">El dominio no está asignado a ninguna tienda en el sistema.</p>
                            </div>
                        `;
                        return;
                    }
                    data = res.data;

                } else {
                    // FASE 2: Dominio Genérico de Netlify
                    if (!parametroTienda || parametroTienda.trim() === '') {
                        document.body.innerHTML = `
                            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">🛑</div>
                                <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Acceso Denegado</h2>
                                <p style="color: #d1d5db;">No se especificó ninguna tienda en el enlace.</p>
                            </div>
                        `;
                        return;
                    }

                    let query = supabase.from('tiendas').select('id, slug');
                    if (/^\d+$/.test(parametroTienda)) {
                        query = query.eq('id', parseInt(parametroTienda));
                    } else {
                        query = query.eq('slug', parametroTienda);
                    }

                    const res = await query.single();

                    if (res.error || !res.data) {
                        document.body.innerHTML = `
                            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">🛑</div>
                                <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Tienda no encontrada</h2>
                                <p style="color: #d1d5db;">El enlace es incorrecto o la tienda no existe.</p>
                            </div>
                        `;
                        return;
                    }
                    data = res.data;

                    if (data.slug && parametroTienda !== data.slug) {
                        window.history.replaceState(null, '', `${window.location.pathname}?tienda=${data.slug}`);
                    }
                }

                // 3. ASIGNACIÓN GLOBAL PARA EL ADMIN
                TIENDA_ID = data.id;
                TIENDA_SLUG = data.slug || data.id;

                // 4. ARRANCAR APLICACIÓN ADMIN
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);

            } catch (err) {
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
                        <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Error de conexión</h2>
                        <p style="color: #d1d5db;">No pudimos conectar con el servidor.</p>
                    </div>
                `;
            }
        };

        initApp();
    </script>
</body>
</html>
