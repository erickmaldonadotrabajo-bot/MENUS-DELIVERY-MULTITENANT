<!DOCTYPE html>
<html lang="es">
<head>
    <!-- AUTO-ACTUALIZADOR: BLOQUEO DE CACHÉ BÁSICO -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ETIQUETAS PWA PARA ACCESO DIRECTO (NATIVE APP FEEL) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Menú Digital</title>
    
    <!-- ÍCONOS COMODÍN (Fallback por si el celular es muy rápido) -->
    <link rel="icon" id="favicon" href="https://cdn-icons-png.flaticon.com/512/900/900797.png">
    <link rel="apple-touch-icon" id="apple-icon" href="https://cdn-icons-png.flaticon.com/512/900/900797.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((registration) => {
                    registration.update();
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log("🔥 Nueva versión detectada. Recargando automáticamente...");
                                window.location.reload(true);
                            }
                        };
                    };
                }).catch(err => console.log('Error SW Index:', err));
            });
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');
        
        :root {
            --color-primary: #f97316;
            --color-bg: #111827;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--color-bg); 
            color: white;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-glow { box-shadow: 0 0 25px var(--color-primary); border-color: var(--color-primary); border-width: 4px; border-style: solid; }
        .bg-glow-effect { background-color: var(--color-primary); }

        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--color-primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">

    <div id="root" class="w-full flex items-center justify-center relative z-10"></div>

    <script type="text/babel" data-type="module" data-presets="react" id="app-v6">
        const { useState, useEffect } = React;

        // 1. CAPTURA DEL ENTORNO (Detectar el Dominio)
        const parametroTienda = new URLSearchParams(window.location.search).get('tienda');
        
        const getCleanDomain = () => {
            let hostname = window.location.hostname;
            hostname = hostname.replace(/^www\./, ''); 
            hostname = hostname.split(':')[0]; 
            return hostname.trim().toLowerCase(); 
        };

        const cleanHostname = getCleanDomain();
        
        const isPremiumDomain = cleanHostname !== 'localhost' 
                             && cleanHostname !== '127.0.0.1' 
                             && !cleanHostname.endsWith('netlify.app')
                             && !cleanHostname.endsWith('netlify.com');

        // 2. CONEXIÓN A BASE DE DATOS
        const SUPABASE_URL = 'https://srhdgocsmswxidrwguhc.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_pWKDoEBfP3l2ggqYh_l7IA_SNq1Esfz'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [tienda, setTienda] = useState(null);
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);

            useEffect(() => {
                const fetchTienda = async () => {
                    try {
                        let data = null;

                        if (isPremiumDomain) {
                            const res = await supabase.from('tiendas').select('*').ilike('dominio_personal', cleanHostname).maybeSingle();
                            if (res.error) { setErrorMsg(`Error BD: ${res.error.message}`); setLoading(false); return; }
                            if (res.data) { data = res.data; } 
                            else { setErrorMsg(`El dominio [${cleanHostname}] no está asignado a ninguna tienda en tu Base de Datos.`); setLoading(false); return; }
                        } else {
                            if (!parametroTienda || parametroTienda.trim() === '') {
                                setErrorMsg("Falta el parámetro en el enlace (ej. ?tienda=slug)."); setLoading(false); return;
                            }
                            let query = supabase.from('tiendas').select('*');
                            if (/^\d+$/.test(parametroTienda)) { query = query.eq('id', parseInt(parametroTienda)); } 
                            else { query = query.eq('slug', parametroTienda); }

                            const res = await query.single();
                            if (res.error || !res.data) { setErrorMsg("La tienda solicitada no existe o el enlace es incorrecto."); setLoading(false); return; }
                            data = res.data;

                            if (data.slug && parametroTienda !== data.slug) {
                                window.history.replaceState(null, '', `${window.location.pathname}?tienda=${data.slug}`);
                            }
                        }

                        // APLICACIÓN DE DATOS AL ENTORNO VISUAL
                        setTienda(data);
                        document.title = data.nombre;
                        
                        if (data.color_primario) document.documentElement.style.setProperty('--color-primary', data.color_primario);
                        if (data.color_fondo) document.documentElement.style.setProperty('--color-bg', data.color_fondo);
                        
                        // =========================================================
                        // GENERADOR DE APP MANIFEST (PWA) Y REEMPLAZO DE ÍCONOS
                        // =========================================================
                        if (data.logo_url) {
                            // 1. Reemplazar los íconos comodín
                            document.getElementById('favicon').href = data.logo_url;
                            document.getElementById('apple-icon').href = data.logo_url;
                            
                            // 2. Título nativo para iOS
                            const titleMeta = document.createElement('meta'); 
                            titleMeta.name = 'apple-mobile-web-app-title'; 
                            titleMeta.content = data.nombre; 
                            document.head.appendChild(titleMeta);

                            // 3. Crear el manifest.json en vivo
                            const manifestJSON = {
                                "name": data.nombre,
                                "short_name": data.nombre,
                                "start_url": window.location.href,
                                "display": "standalone",
                                "background_color": data.color_fondo || "#111827",
                                "theme_color": data.color_primario || "#f97316",
                                "icons": [
                                    { "src": data.logo_url, "sizes": "192x192", "type": "image/png" }, 
                                    { "src": data.logo_url, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
                                ]
                            };
                            
                            // 4. Inyectarlo en la cabeza del documento
                            const manifestBlob = new Blob([JSON.stringify(manifestJSON)], { type: 'application/json' });
                            const manifestLink = document.createElement('link');
                            manifestLink.rel = 'manifest';
                            manifestLink.href = URL.createObjectURL(manifestBlob);
                            document.head.appendChild(manifestLink);
                        }

                    } catch (err) {
                        setErrorMsg(`Error del sistema: ${err.message}`);
                    } finally {
                        setLoading(false);
                    }
                };
                
                fetchTienda();
            }, []);

            const handleShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: tienda.nombre,
                            text: `¡Mira el menu de ${tienda.nombre} y realiza tu pedido!`,
                            url: window.location.href 
                        });
                    } catch (err) { console.log('Error compartiendo:', err); }
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("¡Enlace copiado al portapapeles!");
                }
            };

            if (loading) return <div className="loader"></div>;

            if (errorMsg || !tienda) {
                return (
                    <div className="bg-red-900/40 border border-red-500 p-6 rounded-2xl max-w-sm animate-fade-in w-full shadow-2xl">
                        <div className="text-5xl mb-4">🚫</div>
                        <h2 className="text-2xl font-black mb-2 text-white uppercase tracking-wider">Acceso Denegado</h2>
                        
                    </div>
                );
            }

            const identificador = tienda.slug || tienda.id;
            const linkMenu = isPremiumDomain ? 'menus.html' : `menus.html?tienda=${identificador}`;
            const linkImagenes = isPremiumDomain ? 'menu-imagenes.html' : `menu-imagenes.html?tienda=${identificador}`;

            return (
                <div className="w-full max-w-sm mx-auto animate-fade-in">
                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-glow-effect rounded-full blur-[100px] opacity-20 pointer-events-none -z-10"></div>

                    <img src={tienda.logo_url || "https://cdn-icons-png.flaticon.com/512/900/900797.png"} alt="Logo" className="w-40 h-40 rounded-full mx-auto mb-6 logo-glow object-cover bg-gray-900" />
                    
                    <h1 className="text-4xl font-black text-white mb-2 tracking-wider uppercase drop-shadow-md">{tienda.nombre}</h1>
                    <p className="text-gray-300 font-bold tracking-widest text-sm mb-10 uppercase" style={{ color: tienda.color_primario || '#f97316' }}>
                        {tienda.mensaje_bienvenida || 'El mejor sabor hasta tu casa'}
                    </p>

                    <div className="space-y-4 relative z-20">
                        <a href={linkMenu} className="block w-full text-white font-bold text-xl py-5 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all" style={{ background: `linear-gradient(to right, ${tienda.color_primario || '#f97316'}, ${tienda.color_secundario || '#ef4444'})` }}>
                            🛵 HACER UN PEDIDO
                        </a>

                        {tienda.menu_imagenes_url ? (
                            <a href={linkImagenes} target="_blank" rel="noopener noreferrer" className="block w-full bg-gray-800 text-white font-bold text-lg py-4 rounded-2xl border-2 border-gray-700 hover:bg-gray-700 active:scale-95 transition-all" style={{ borderColor: tienda.color_primario || '#374151' }}>
                                📖 VER MENÚ EN IMÁGENES
                            </a>
                        ) : (
                            <div className="block w-full bg-gray-800/50 text-gray-500 font-bold text-sm py-4 rounded-2xl border border-gray-800 cursor-not-allowed">
                                📖 Menú en imágenes no disponible
                            </div>
                        )}

                        {tienda.latitud && tienda.longitud && (
                            <a href={`https://www.google.com/maps/search/?api=1&query=${tienda.latitud},${tienda.longitud}`} target="_blank" rel="noopener noreferrer" className="block w-full bg-blue-600/10 text-blue-400 font-bold text-lg py-4 rounded-2xl border border-blue-600/30 hover:bg-blue-600 hover:text-white active:scale-95 transition-all flex items-center justify-center gap-2">
                                📍 VER UBICACIÓN
                            </a>
                        )}

                        <button onClick={handleShare} className="block w-full bg-gray-800 text-white font-bold text-lg py-4 rounded-2xl border-2 border-gray-700 hover:bg-gray-700 active:scale-95 transition-all flex items-center justify-center gap-2" style={{ borderColor: tienda.color_primario || '#374151' }}>
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                            COMPARTIR TIENDA
                        </button>
                    </div>

                    <p className="text-gray-500 text-xs mt-12 font-medium">
                        © {new Date().getFullYear()} {tienda.nombre}. Todos los derechos reservados.
                    </p>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
