<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ========================================== -->
    <!-- AUTO-ACTUALIZADOR: BLOQUEO DE CACHÉ BÁSICO -->
    <!-- ========================================== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargando Menú...</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPrimary: 'var(--color-primary, #f97316)',
                        brandSecondary: 'var(--color-secondary, #ef4444)',
                        brandBg: 'var(--color-bg, #111827)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <!-- ========================================== -->
    <!-- AUTO-ACTUALIZADOR: RECARGA SILENCIOSA (SW) -->
    <!-- ========================================== -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((registration) => {
                    registration.update();
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log("🔥 Nueva versión de Menú Imágenes detectada. Recargando...");
                                window.location.reload(true);
                            }
                        };
                    };
                }).catch(err => console.log('Error SW Menu Imagenes:', err));
            });
        }
    </script>

    <style>
        :root {
            --color-primary: #f97316;
            --color-secondary: #ef4444;
            --color-bg: #111827;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: var(--color-bg); 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fade-in-down { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-down { animation: fade-in-down 0.3s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }

        .loader { 
            border: 4px solid rgba(255,255,255,0.1); 
            border-top: 4px solid var(--color-primary); 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="min-h-screen pb-10 text-white">

    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react" id="app-imagenes-v4">
        const { useState, useEffect } = React;

        // GLOBALES: Asignadas dinamicamente en el interceptor de arranque
        let TIENDA_ID = null;
        let TIENDA_SLUG = null;
        let IS_PREMIUM_DOMAIN = false; // Nos dirá si ocultamos el '?tienda=' en los botones

        const SUPABASE_URL = 'https://srhdgocsmswxidrwguhc.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_pWKDoEBfP3l2ggqYh_l7IA_SNq1Esfz'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [tienda, setTienda] = useState(null);
            const [imagenes, setImagenes] = useState([]);
            const [loading, setIsLoading] = useState(true);

            useEffect(() => {
                const fetchTienda = async () => {
                    try {
                        const { data, error } = await supabase.from('tiendas').select('*').eq('id', TIENDA_ID).single();

                        if (error) throw error;

                        if (data) {
                            setTienda(data);
                            document.title = `Menú | ${data.nombre}`;

                            if (data.color_primario) document.documentElement.style.setProperty('--color-primary', data.color_primario);
                            if (data.color_fondo) document.documentElement.style.setProperty('--color-bg', data.color_fondo);

                            if (data.menu_imagenes_url) {
                                const urlsArray = data.menu_imagenes_url.split(',').map(url => url.trim()).filter(url => url.length > 0);
                                setImagenes(urlsArray);
                            }
                        }
                    } catch (err) {
                        console.error("Error cargando el menú de imágenes:", err);
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchTienda();
            }, []);

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

            if (!tienda) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 text-center">
                        <div className="bg-red-900/40 border border-red-500 p-6 rounded-2xl max-w-sm animate-fade-in-down">
                            <h2 className="text-xl font-bold mb-2">Tienda no encontrada</h2>
                            <a href={`index.html`} className="text-gray-300 text-sm underline hover:text-white transition-colors">Volver al inicio</a>
                        </div>
                    </div>
                );
            }

            const identificador = tienda.slug || tienda.id;
            
            // ENLACES INTELIGENTES: Dependen de si es dominio propio o genérico
            const linkInicio = IS_PREMIUM_DOMAIN ? 'index.html' : `index.html?tienda=${identificador}`;
            const linkMenus = IS_PREMIUM_DOMAIN ? 'menus.html' : `menus.html?tienda=${identificador}`;

            return (
                <div className="animate-fade-in-down">

                    {/* Elemento bloque cabecera con fijacion magnetica (sticky) */}
                    <div className="sticky top-0 backdrop-blur-xl p-4 text-center z-50 border-b border-gray-800 shadow-lg" style={{ backgroundColor: 'var(--color-bg)CC' }}>
                        <h1 className="font-black text-2xl tracking-widest uppercase drop-shadow-md" style={{ color: tienda.color_primario || '#f97316' }}>
                            NUESTRO MENÚ
                        </h1>
                        <a href={linkInicio} className="text-gray-400 text-sm font-bold mt-1 inline-block hover:text-white transition-colors">
                            ⬅ Volver al inicio
                        </a>
                    </div>

                    <div className="max-w-md mx-auto flex flex-col items-center gap-8 mt-6 px-4">
                        {imagenes.length > 0 ? (
                            imagenes.map((url, index) => (
                                <div key={index} className="w-full flex flex-col gap-3 animate-slide-up">
                                    <img 
                                        src={url} 
                                        alt={`Menú ${tienda.nombre} página ${index + 1}`} 
                                        className="w-full rounded-2xl shadow-2xl border border-gray-700 bg-gray-800 object-cover" 
                                        loading={index === 0 ? "eager" : "lazy"} 
                                    />

                                    <a 
                                        href={linkMenus} 
                                        className="block w-full text-white text-center font-black text-xl py-4 rounded-xl shadow-lg active:scale-95 transition-transform"
                                        style={{ 
                                            background: `linear-gradient(to right, ${tienda.color_primario || '#f97316'}, ${tienda.color_secundario || '#ef4444'})`,
                                            border: `1px solid ${tienda.color_primario || '#f97316'}`
                                        }}
                                    >
                                        🛵 ¡QUIERO PEDIR AHORA!
                                    </a>
                                </div>
                            ))
                        ) : (
                            <div className="text-center py-20 bg-gray-900/50 w-full rounded-2xl border border-gray-800">
                                <p className="text-gray-400 font-medium">Esta tienda aún no ha subido imágenes de su menú.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==========================================
        // ARRANQUE Y CANDADO MAESTRO (ACTUALIZADO)
        // ==========================================
        const initApp = async () => {
            const parametroTienda = new URLSearchParams(window.location.search).get('tienda');

            const getCleanDomain = () => {
                let hostname = window.location.hostname;
                hostname = hostname.replace(/^www\./, ''); 
                hostname = hostname.split(':')[0]; 
                return hostname.trim().toLowerCase(); 
            };

            const cleanHostname = getCleanDomain();
            
            const isPremiumDomain = cleanHostname !== 'localhost' 
                                 && cleanHostname !== '127.0.0.1' 
                                 && !cleanHostname.endsWith('netlify.app')
                                 && !cleanHostname.endsWith('netlify.com');

            // Guardamos la variable global para que los botones sepan cómo comportarse
            IS_PREMIUM_DOMAIN = isPremiumDomain;

            try {
                let data = null;

                if (isPremiumDomain) {
                    // FASE 1 ESTRICTA: Dominio Propio
                    const res = await supabase.from('tiendas').select('id, slug').ilike('dominio_personal', cleanHostname).maybeSingle();
                    
                    if (res.error) throw new Error(res.error.message);
                    
                    if (!res.data) {
                        document.body.innerHTML = `
                            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">🚫</div>
                                <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Acceso Denegado</h2>
                                <p style="color: #d1d5db;">El dominio no está asignado a ninguna tienda en el sistema.</p>
                            </div>
                        `;
                        return;
                    }
                    data = res.data;

                } else {
                    // FASE 2: Dominio Genérico de Netlify
                    if (!parametroTienda || parametroTienda.trim() === '') {
                        document.body.innerHTML = `
                            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">🚫</div>
                                <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Acceso Denegado</h2>
                                <p style="color: #d1d5db;">No se especificó ninguna tienda en el enlace.</p>
                            </div>
                        `;
                        return;
                    }

                    let query = supabase.from('tiendas').select('id, slug');
                    if (/^\d+$/.test(parametroTienda)) {
                        query = query.eq('id', parseInt(parametroTienda));
                    } else {
                        query = query.eq('slug', parametroTienda);
                    }

                    const res = await query.single();

                    if (res.error || !res.data) {
                        document.body.innerHTML = `
                            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                                <div style="font-size: 4rem; margin-bottom: 1rem;">🚫</div>
                                <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Tienda no encontrada</h2>
                                <p style="color: #d1d5db;">El enlace es incorrecto o la tienda solicitada no existe.</p>
                            </div>
                        `;
                        return;
                    }
                    data = res.data;

                    if (data.slug && parametroTienda !== data.slug) {
                        window.history.replaceState(null, '', `${window.location.pathname}?tienda=${data.slug}`);
                    }
                }

                // 3. ASIGNACIÓN GLOBAL DE TIENDA
                TIENDA_ID = data.id;
                TIENDA_SLUG = data.slug || data.id;

                // 4. ARRANCAR APLICACIÓN
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);

            } catch (err) {
                console.error("Error inicializando app:", err);
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#111827; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
                        <h2 style="font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Error de conexión</h2>
                        <p style="color: #d1d5db;">No pudimos conectar con el servidor.</p>
                    </div>
                `;
            }
        };

        initApp();
    </script>
</body>
</html>
